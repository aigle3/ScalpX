# Diagnostic : vrai MetaTrader 5 (sans compte) avec l'EA sur un graphique : masquage des panneaux par le bot,
# captures d'écran du panneau. Seulement sur la branche « diag » (jamais proposé au VPS) ; résultats poussés sur diag.
name: Fenêtre MT5 (diagnostic)
on:
  push:
    branches: [diag]
    paths-ignore: ["diag-out/**"]
permissions:
  contents: write
jobs:
  window:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer MetaTrader 5
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile mt5setup.exe
          Start-Process .\mt5setup.exe -ArgumentList '/auto' -Wait
          $t = 'C:\Program Files\MetaTrader 5\terminal64.exe'
          for ($i = 0; $i -lt 120 -and -not (Test-Path $t); $i++) { Start-Sleep -Seconds 5 }
          Start-Sleep -Seconds 10
          Get-Process terminal64, metaeditor64 -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Compiler l'EA dans MT5 (portable)
        shell: pwsh
        run: |
          $mt = 'C:\Program Files\MetaTrader 5'
          New-Item -ItemType Directory -Force "$mt\MQL5\Experts" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\ea\MQL5\Experts\*" "$mt\MQL5\Experts\" -Force
          Start-Process "$mt\MetaEditor64.exe" -ArgumentList @('/portable', "/compile:`"$mt\MQL5\Experts\ScalpX_v5.mq5`"", "/log:`"$env:RUNNER_TEMP\c.log`"") -Wait
          Get-Content "$env:RUNNER_TEMP\c.log" -Encoding Unicode | Select-Object -Last 3
          Test-Path "$mt\MQL5\Experts\ScalpX_v5.ex5"
      - name: Écran 1920×1080
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Lancer MT5 avec l'EA, masquer les panneaux, captures
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pip install -q psutil pillow
          $mt = 'C:\Program Files\MetaTrader 5'
          $ini = "$env:RUNNER_TEMP\run.ini"
          "[Experts]`r`nAllowLiveTrading=0`r`nEnabled=1`r`n[StartUp]`r`nExpert=ScalpX_v5`r`nSymbol=EURUSD`r`nPeriod=M5`r`n" | Set-Content $ini -Encoding Unicode
          Start-Process "$mt\terminal64.exe" -ArgumentList @('/portable', "/config:$ini")
          Start-Sleep -Seconds 75
          New-Item -ItemType Directory -Force diag-out | Out-Null
          python -c "from PIL import ImageGrab; ImageGrab.grab().save('diag-out/1_avant.png')"
          python .github/scripts/window_check.py
          Start-Sleep -Seconds 5
          python -c "from PIL import ImageGrab; ImageGrab.grab().save('diag-out/2_apres.png')"
          Start-Sleep -Seconds 3
          python -c "from PIL import ImageGrab; ImageGrab.grab().save('diag-out/3_panneau.png')"
          Get-ChildItem "$mt\MQL5\Logs" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1 | ForEach-Object { Get-Content $_.FullName -Encoding Unicode | Select-Object -Last 40 } | Set-Content diag-out/experts.log
      - name: Pousser les résultats sur diag
        shell: pwsh
        run: |
          git config user.name "diag"; git config user.email "diag@example.invalid"
          git add -f diag-out
          git commit -m "diag : captures"
          git push origin HEAD:diag
